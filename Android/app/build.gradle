apply plugin: 'com.android.application'

android {
    compileSdk rootProject.compileSdkVersion
    namespace "com.trtc.uikit.livekit.example"

    // Required because this module declares custom BuildConfig fields below.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.trtc.uikit.livekit.example"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        buildConfigField "String", "SUPABASE_URL", "\"\u0024{project.findProperty('SUPABASE_URL') ?: ''}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"\u0024{project.findProperty('SUPABASE_PUBLISHABLE_KEY') ?: ''}\""
        buildConfigField "String", "AGORA_APP_ID", "\"\u0024{project.findProperty('AGORA_APP_ID') ?: ''}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.agora.rtc:voice-sdk:4.6.2"
}
